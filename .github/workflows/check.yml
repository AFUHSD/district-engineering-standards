name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse JSON and PowerShell
        shell: pwsh
        run: ./.github/check.ps1
      - name: Test the apply script against a fake gh
        shell: pwsh
        run: ./tests/apply.tests.ps1
